name: 24-7 Global Real Estate Follow-up Engine

on:
  workflow_dispatch: # Allows manual trigger from GitHub web UI
  schedule:
    # Runs at minute 30 of every hour (24/7 global timezone awareness)
    - cron: '30 * * * *'

permissions:
  contents: write

jobs:
  run-followups:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 📬 Execute Automated Timezone-Aware Follow-ups
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_APP_PASSWORD: ${{ secrets.SENDER_APP_PASSWORD }}
          SENDER_NAME: ${{ secrets.SENDER_NAME || 'Sajjad Wali' }}
          PORTFOLIO_URL: ${{ secrets.PORTFOLIO_URL || 'https://sajjad-wali-portfolio.vercel.app/' }}
          DRY_RUN: 'False'
          MAX_DAILY_EMAILS: '20'
        run: |
          python main.py --followup --live

      - name: 💾 Commit & Push Updated CRM Database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add leads_tracker.db social_dm_leads.csv reports/ 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "Auto-update follow-up status & CRM database [skip ci]" && git push)
